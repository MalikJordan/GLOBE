    # -------------------------------------------------------------------------------------------------
    phyto1:
      cell_quota:
        n:
          max:
            lower:
            initial: 0.25
            upper:
          min:
            lower:
            initial: 6.87E-03
            upper:
          opt:
            lower:
            initial: 1.26E-02
            upper:
        p:
          max:
            lower:
            initial: 2.5E-03
            upper:
          min:
            lower:
            initial: 4.29E-04
            upper:
          opt:
            lower:
            initial: 7.86E-04
            upper:
        chl:
          max:
            lower:
            initial: 0.016
            upper:
          min:
            lower:
            initial: 0.016
            upper:
          opt:
            lower:
            initial: 0.016
            upper:
      exudation:
        excreted_fraction:
          lower: 
          initial: 0.05
          upper:
      growth:
        light_attenuation:
          lower:
          initial: 0.03
          upper:
        max_photo_rate:
          lower:
          initial: 1.6
          upper:
        chl_relax_rate:
          lower:
          initial: 0.
          upper:
