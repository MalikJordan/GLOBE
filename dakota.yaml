    # -------------------------------------------------------------------------------------------------
    pom1:
      light_attenuation:
        lower:
        initial: 1.E-04
        upper:
      remineralization:
        remineralization_rate:
          lower:
          initial: 0.1
          upper:
      sinking:
        sinking_rate:
          lower:
          initial: 1.
          upper:
        burial_velocity: 
          lower:
          initial: 1.
          upper: