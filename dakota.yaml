          lower:
          initial: 0.
          upper:
        half_sat_stress_lysis:
          lower:
          initial: 0.1
          upper:
        max_stress_lysis_rate:
          lower:
          initial: 0.05
          upper:
      respiration:
        activity_respiration_frac:
          lower:
          initial: 0.05
          upper:
        basal_respiration_rate:
          lower:
          initial: 0.05
          upper:
      uptake:
        n:
          half_sat_nh4_preference:
            lower:
            initial: 1.5
            upper:
          luxury_storage:
            lower:
            initial: 1.
            upper:
          specific_affinity:
            lower:
            initial: 0.025
            upper:
        p:
          luxury_storage:
            lower:
            initial: 1.
            upper:
          specific_affinity:
            lower:
            initial: 0.0025
            upper:
    
    # -------------------------------------------------------------------------------------------------
    # Zooplankton
    # -------------------------------------------------------------------------------------------------
    zoo1:
      cell_quota:
        n:
          opt:
            lower:
            initial: 1.258E-02
            upper:
        p:
          opt:
            lower:
            initial: 7.862E-04
            upper:
      excretion:
        assimilation_efficiency:
          lower:
          initial: 0.25
          upper:
        ingestion_efficiency:
          lower:
          initial: 0.5
          upper:
