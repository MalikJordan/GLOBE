dakota:
  environment:
    tabular_data_file:

  method:
    type: sampling
    samples: 100
    seed: 12345
    sample_type: lhs

  model:
    type: single

  interface:
    analysis_driver: 
    fork: True
    asynchronous: True
    evaluation_concurrency: 8
  
  responses:
    num_objective_functions: 1
    gradients: False
    hessians: False


parameters:
# -------------------------------------------------------------------------------------------------
# POM1D Parameters
# -------------------------------------------------------------------------------------------------
  pom1d:
    relaxation_velocities:
      nrt_o2:
        lower:
        initial: 0.06
        upper:
      nrt_po4:
        lower:
        initial: 0.06
        upper:
      nrt_no3:
        lower:
        initial: 0.06
        upper:
      nrt_nh4:
        lower:
        initial: 0.05
        upper:
    
    background_diffusion:
      umol:
        lower:
        initial: 1.E-06
        upper:
      umolt:
        lower:
        initial: 1.E-07
        upper:
      umols:
        lower:
        initial: 1.3E-07
        upper:
      umolbgc:
        lower:
        initial: 1.E-04
        upper:

# -------------------------------------------------------------------------------------------------
# BGC Parameters
# -------------------------------------------------------------------------------------------------
  bfm17_new_structure:
    # -------------------------------------------------------------------------------------------------
    # Nutrients
    # -------------------------------------------------------------------------------------------------
    nh4:
      nitrification:
        half_sat_oxygen:
          lower:
          initial: 10.
          upper:
        nitrification_rate:
          lower:
          initial: 0.01
          upper:

    # -------------------------------------------------------------------------------------------------
