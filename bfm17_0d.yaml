base_element: c

tracers:
  o2:
    long_name: oxygen
    type: inorganic
    composition: [o]
    parameters:
      temperature_regulation:
        temp_limited: False

      reaeration:
        d: 0.31
        k1: 1953.4
        k2: 128.0
        k3: 3.9918
        k4: 0.050091
        schmidt: 660.0
        saturation_conversion: stp        # options: "ideal_gas" or "stp"

  no3:
    long_name: nitrate
    type: inorganic
    composition: [n]
    parameters:
      temperature_regulation:
        temp_limited: True
        function: q10
        coefficient: 2.367
        base_temp: 10.

  nh4:
    long_name: ammonium
    type: inorganic
    composition: [n]
    parameters:
      temperature_regulation:
        temp_limited: True
        function: q10
        coefficient: 2.367
        base_temp: 10.

      nitrification:
        half_sat_oxygen: 10.0               # [mmol O2 / m^3]
        nitrification_rate: 0.01            # [1/d]
        convert_o2: 2.0

  po4:
    long_name: phosphate
    type: inorganic
    composition: [p]
    parameters:
      temperature_regulation:
        temp_limited: False

  hs:
    long_name: reduction equivalents
    type: inorganic
    composition: [s]
    parameters:
      temperature_regulation:
        temp_limited: False

      reoxidation:
        half_sat_oxygen: 10.0               # [mmol O2 / m^3]
        reoxidation_rate: 0.05              # [1/d]
        convert_o2: 2.                      # [mmol O2 / mmol HS-]

  phyto1:
    long_name: diatoms
    type: phytoplankton
    composition: [c,n,p,chl]
    parameters:
      cell_quota:
        # max: {n: 1.26E-02, p: 7.86E-04, chl: 0.016}
        # min: {n: 6.873E-03, p: 4.29E-04, chl: 0.016}
        # opt: {n: 1.26E-02, p: 7.86E-04, chl: 0.016}
        max: {c: 1., n: 1.26E-02, p: 7.86E-04, chl: 0.016}
        min: {c: 1., n: 6.873E-03, p: 4.29E-04, chl: 0.016}
        opt: {c: 1., n: 1.26E-02, p: 7.86E-04, chl: 0.016}
      
      nutrient_limitation:  
        colimitation: minimum               # mininimum, product, or sum of all limiting nutrients
        include: ["no3","po4"]              # nutrients included for calculation of colimitation factor
        no3:
          type: internal
          function: droop
          nh4_inihibited: True
        nh4:
          type: external
          function: monod
          half_sat: 1.
        po4:
          type: internal
          function: droop

      temperature_regulation:
        temp_limited: True
        function: q10
        coefficient: 2.
        base_temp: 10.

      exudation:
        method: photosynthesis              # options: uptake, photosynthesis
        # "photosynthesis": exudation rate calculated using excreted fraction of photosynthesis
        # "uptake": exudation rate calculated using constant excreted fraction of nutrient uptake
        excreted_fraction: 0.05             # [-]
        include_activity: True
        include_nutrient_stress: True

      growth:
        light_limitation: platt
        light_location: integrated
        light_attenuation: 0.03             # [m^2 / mg Chl]
        max_photo_rate: 1.6                 # [1/d]
        chl_quota: 0.016                    # [mg Chl / mg C]
        chl_relax_rate: 0.                  # [(mg C . m^2) / (mg Chl μE)]
        initial_PI_slope: 1.52E-05          # [(mg C . m^2) / (mg Chl μE)]
        eps_PAR: 0.4
        convert_o2: 1/12                    # [mmol 02 / mg C]
        optimal_Epar_Ek: 0.

      lysis:
        method: cell_quota
        extra_lysis_rate: 0.0               # [1/d]
        half_sat_stress_lysis: 0.1
        half_sat_extra_lysis: 0.0
        max_stress_lysis_rate: 0.05         # [1/d]
        apportioning_factor:  # list of elements of which to apply apportioning factor to, elements not included will not have dissolved/particulate apportioning factor applied
          dom1: [c,n,p]
          pom1: [c,n,p]

      respiration:
        activity_respiration_frac: 0.05     # [-]
        basal_respiration_rate: 0.05        # [1/d]
        convert_o2: 1/12                    # [mmol O2 / unit base_element]
      
      uptake:
        no3:
          basis: nutrient
          strategy: independent
          form: affinity                      # options: affinity or constituent
          # affinity: uses specific affinity, based on cell quota w.r.t base element
          # constituent: uses concentration of phytoplankton constituent of nutrient element
          half_sat_nh4_preference: 1.0
          # half_sat_nh4_uptake: 1.5            # [mmol N-NH4 / m^3]
          luxury_storage: 1.5
          specific_affinity: 0.025            # [m^3 / (mg C . d)]
        nh4:
          basis: nutrient
          strategy: independent
          form: affinity                      # options: affinity or constituent
          # affinity: uses specific affinity, based on cell quota w.r.t base element
          # constituent: uses concentration of phytoplankton constituent of nutrient element
          half_sat_nh4_preference: 1.0
          # half_sat_nh4_uptake: 1.5            # [mmol N-NH4 / m^3]
          luxury_storage: 1.5
          specific_affinity: 0.025            # [m^3 / (mg C . d)]
        po4:
          basis: nutrient
          strategy: independent
          form: affinity                      # options: affinity or constituent
          # affinity: uses specific affinity, based on cell quota w.r.t base element
          # constituent: uses concentration of phytoplankton constituent of nutrient element
          luxury_storage: 1.0
          specific_affinity: 0.0025           # [m^3 / (mg C . d)]

  zoo1:
    long_name: mesozooplankton
    type: zooplankton
    composition: [c,n,p]
    parameters:
      cell_quota:
        # opt: {n: 1.67E-02, p: 1.85E-03}
        opt: {c: 1., n: 1.67E-02, p: 1.85E-03}

      temperature_regulation:
        temp_limited: True
        function: q10
        coefficient: 2.0
        base_temp: 10.
      
      oxygen_inhibition:
        oxygen_limited: True
        half_sat: 0.5                       # [mmol O2 / m^3]
        exponent: 1.

      om_partition:
        dom1: {c: 0.60, n: 0.72, p: 0.832}  # c,n,p [-]
        pom1: {c: 0.40, n: 0.28, p: 0.168}  # c,n,p [-]

      efficiency:
        assimilation: 0.5
        ingestion: 0.25

      egestion:
        unassimilated: [c]

      excretion:
        destination:
          n: nh4
          p: po4
        function:
        # "activity"      --> calculates excretion based on total ingestion and respiratory costs
        # numerical value --> constant excretion rate
          n: activity
          p: activity

      grazing:
        grazing_preferences: {phyto1: 1.}
        # grazing_preferences: {phyto1: 1., zoo1: 1.E-06}
        function: holling-2
        feeding_threshold: 50.0             # [mg C / m^3]
        max_grazing_rate: 2.0               # [1/d]
        half_sat_grazing: 200.0             # [mg C / m^3]
        feeding_model: half_saturation      # options: "half_saturation" and "clearance_rate"
        # if feeding_model: "half_saturation" --> requires "half_sat_grazing" as additional parameter
        # if feeding_model: "clearance_rate"  --> requires "search_volume" as additional parameter

      mortality:
        mortality_rate: 
          linear: 0.                        # linear [1/d]
          quadratic: 0.                     # quadratic [1/d^2]
          oxygen: 0.25                      # [1/d]
        temp_limitation:
          linear: False
          quadratic: False
          oxygen: False

      respiration:
        respiration_rate: 0.02              # [1/d]
        convert_o2: 1/12                    # [mmol 02 / mg C]

  dom1:
    long_name: dissolved organic matter
    type: detritus
    form: dissolved
    composition: [c,n,p]
    parameters:
      light_attenuation: 0.0                # [m^2 / mg C]

      remineralization:
        remineralization_rate: 0.3          # [1/d]
        convert_o2: 1/12                    # [mmol 02 / mg C]

  pom1:
    long_name: particulate organic matter
    type: detritus
    form: particulate
    composition: [c,n,p]
    parameters:
      light_attenuation: 1.0E-04            # [m^2 / mg C]

      remineralization:
        remineralization_rate: 0.3          # [1/d]
        convert_o2: 1/12                    # [mmol 02 / mg C]

# -------------------------------------------------------------------------------------------------
reactions:
  # inorganic rates -------------------------------------------------------------------------------------------------
  - type: nitrification
    consumed:
      nh4: [n]
      o2: [o]
    produced: 
      no3: [n]

  - type: reoxidation
    consumed:
      hs: [s]
      o2: [o]
    produced:

  - type: reaeration
    consumed:
    produced:
      o2: [o]

  # phyto1 rates -------------------------------------------------------------------------------------------------
  - type: chlorophyll_synthesis
    consumed:
    produced:
      phyto1: [chl]

  - type: exudation
    consumed:
      phyto1: [c]
    produced:
      dom1: [c]

  - type: gross_primary_production
    consumed:
    produced:
      phyto1: [c]
      o2: [o]

  - type: lysis
    consumed:
      phyto1: [c,n,p]
    produced:
      dom1: [c,n,p]

  - type: lysis
    consumed:
      phyto1: [c,n,p]
    produced:
      pom1: [c,n,p]

  - type: photosynthesis
    consumed:
      phyto1: [c]
    produced:

  - type: respiration
    consumed:
      phyto1: [c]
      o2: [o]
    produced:

  - type: uptake
    consumed:
      no3: [n]
    produced:
      phyto1: [n]
      dom1: [n]

  - type: uptake
    consumed:
      nh4: [n]
    produced:
      phyto1: [n]
      dom1: [n]

  - type: uptake
    consumed:
      po4: [p]
    produced:
      phyto1: [p]
      dom1: [p]

  # zoo1 rates -------------------------------------------------------------------------------------------------
  - type: egestion
    consumed:
      zoo1: [c,n,p]
    produced:
      dom1: [c,n,p]

  - type: egestion
    consumed:
      zoo1: [c,n,p]
    produced:
      pom1: [c,n,p]

  - type: excretion
    consumed:
      zoo1: [n]
    produced:
      nh4: [n]

  - type: excretion
    consumed:
      zoo1: [p]
    produced:
      po4: [p]

  - type: grazing
    consumed:
      phyto1: [c,n,p,chl]
    produced:
      zoo1: [c,n,p]

  - type: mortality
    consumed:
      zoo1: [c,n,p]
    produced:
      dom1: [c,n,p]

  - type: mortality
    consumed:
      zoo1: [c,n,p]
    produced:
      pom1: [c,n,p]

  - type: respiration
    consumed:
      zoo1: [c]
      o2: [o]
    produced:

  # dom1 rates -------------------------------------------------------------------------------------------------
  - type: remineralization
    consumed:
      dom1: [c]
      o2: [o]
    produced:

  - type: remineralization
    consumed:
      dom1: [n]
    produced:
      nh4: [n]

  - type: remineralization
    consumed:
      dom1: [p]
    produced:
      po4: [p]

  # pom1 rates -------------------------------------------------------------------------------------------------
  - type: remineralization
    consumed:
      pom1: [c]
      o2: [o]
    produced:

  - type: remineralization
    consumed:
      pom1: [n]
    produced:
      nh4: [n]

  - type: remineralization
    consumed:
      pom1: [p]
    produced:
      po4: [p]
