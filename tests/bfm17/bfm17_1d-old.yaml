base_element: c

tracers:
  o2:
    long_name: oxygen
    type: inorganic
    composition: [o]
    parameters:
      temperature_regulation:
        temp_limited: False
      surface_flux: True

      reaeration:
        d: 0.31
        k1: 1953.4
        k2: 128.0
        k3: 3.9918
        k4: 0.050091
        schmidt: 660.0

  no3:
    long_name: nitrate
    type: inorganic
    composition: [n]
    parameters:
      temperature_regulation:
        temp_limited: True
        function: q10                       # options: arrhenius, eppley, or q10
        # arrhenius: needs "activation_energy" and "coefficient" as additional parameters
        # eppley: needs "coefficient" as additional parameter
        # q10: needs "base_temp" and "coefficient" as additional parameters
        coefficient: 2.
        base_temp: 20.

  nh4:
    long_name: ammonium
    type: inorganic
    composition: [n]
    parameters:
      temperature_regulation:
        temp_limited: True
        function: q10                       # options: [1] arrhenius, [2] eppley, or [3] q10
        # arrhenius: needs "activation_energy" and "coefficient" as additional parameters
        # eppley: needs "coefficient" as additional parameter
        # q10: needs "base_temp" and "coefficient" as additional parameters
        coefficient: 2.
        base_temp: 20.

      nitrification:
        half_sat_oxygen: 10.0               # [mmol O2 / m^3]
        nitrification_rate: 0.01            # [1/d]
        convert_o2: 2.0

  po4:
    long_name: phosphate
    type: inorganic
    composition: [p]
    parameters:
      temperature_regulation:
        temp_limited: False

  phyto1:
    long_name: diatoms
    type: phytoplankton
    composition: [c,n,p,chl]
    parameters:
      cell_quota:
        # n: {max: 0.025, min: 6.87E-03, opt: 1.26E-02}
        # p: {max: 2.5E-03, min: 4.29E-04, opt: 7.86E-04}
        # chl: {max: 0.016, min: 0.016, opt: 0.016}

        max: {n: 0.025, p: 2.5E-03, chl: 0.016}
        min: {n: 6.87E-03, p: 4.29E-04, chl: 0.016}
        opt: {n: 1.26E-02, p: 7.86E-04, chl: 0.016}

      nutrient_limitation:  
        colimitation: minimum               # [1] mininimum, [2] product, or [3] sum of all limiting nutrients
        include: ["no3","po4"]              # nutrients included for calculation of colimitation factor
        no3:
          type: internal
          function: droop
          nh4_inhibited: True
        nh4:
          type: external
          function: monod
          half_sat: 1.
        po4:
          type: internal
          function: droop

      sedimentation:
        sinking: False
        background_sinking_rate: 0.
        burial_velocity: 0.

      temperature_regulation:
        temp_limited: True
        function: q10                       # options: [1] arrhenius, [2] eppley, or [3] q10
        # arrhenius: needs "activation_energy" and "coefficient" as additional parameters
        # eppley: needs "coefficient" as additional parameter
        # q10: needs "base_temp" and "coefficient" as additional parameters
        coefficient: 2.
        base_temp: 20.

      exudation:
        method: photosynthesis              # options: uptake, photosynthesis
        # "photosynthesis": exudation rate calculated using excreted fraction of photosynthesis
        # "uptake": exudation rate calculated using constant excreted fraction of nutrient uptake
        excreted_fraction: 0.05             # [-]

      growth:
        light_limitation: platt             # options: monod, geider, platt, or smith
        light_location: integrated          # options: top, middle, or integrated
        # top: light calculated at top of the cell
        # middle: light calculated in middle of cell
        # integrated: light integrated through cell
        light_attenuation: 0.03
        max_photo_rate: 1.6
        chl_quota: 0.016                    # [mg Chl / mg C]
        chl_relax_rate: 0.                  # [(mg C . m^2) / (mg Chl μE)]
        initial_PI_slope: 1.52E-05
        eps_PAR: 0.4
        convert_o2: 1/12                    # [mmol 02 / mg C]
        optimal_Epar_Ek: 0.

      lysis:
        method: cell_quota                  # options: constant or cell_quota
        # constant: based on constant lysis rate
        # cell_quota: based on elemental ratios within zooplankton cell
        extra_lysis_rate: 0.
        half_sat_stress_lysis: 0.1
        half_sat_extra_lysis: 0.0
        max_stress_lysis_rate: 0.05         # [1/d]

      respiration:
        activity_respiration_frac: 0.05     # [-]
        basal_respiration_rate: 0.05        # [1/d]
        convert_o2: 1/12                    # [mmol 02 / mg C]

      uptake:
        no3:
          basis: nutrient                   # (if strategy is "independent") options: constant, growth, or nutrient
          # constant: based on constant uptake rate
          # growth: based on photosynthesis and nutrient limitation
          # nutrient: based on nutrient availabilty
          strategy: independent             # options: independent or coupled
          # independent: calculates uptake rate based on the nutrient
          # coupled: uses conversion factor to calculate uptake rated based on uptake of a different nutrient
          form: affinity                    # options: affinity or constituent
          # affinity: uses specific affinity, based on cell quota w.r.t base element
          # constituent: uses concentration of phytoplankton constituent of nutrient element
          half_sat_nh4_preference: 1.5
          luxury_storage: 1.
          max_photo_rate: 1.6               # [1/d]
          specific_affinity: 0.025          # [m^3 / (mg C . d)]
        nh4:
          basis: nutrient                   # (if strategy is "independent") options: constant, growth, or nutrient
          # constant: based on constant uptake rate
          # growth: based on photosynthesis and nutrient limitation
          # nutrient: based on nutrient availabilty
          strategy: independent             # options: independent or coupled
          # independent: calculates uptake rate based on the nutrient
          # coupled: uses conversion factor to calculate uptake rated based on uptake of a different nutrient
          form: affinity                    # options: affinity or constituent
          # affinity: uses specific affinity, based on cell quota w.r.t base element
          # constituent: uses concentration of phytoplankton constituent of nutrient element
          half_sat_nh4_preference: 1.5
          luxury_storage: 1.
          max_photo_rate: 1.6               # [1/d]
          specific_affinity: 0.025          # [m^3 / (mg C . d)]
        po4:
          basis: nutrient                   # (if strategy is "independent") options: constant, growth, or nutrient
          # constant: based on constant uptake rate
          # growth: based on photosynthesis and nutrient limitation
          # nutrient: based on nutrient availabilty
          strategy: independent             # options: independent or coupled
          # independent: calculates uptake rate based on the nutrient
          # coupled: uses conversion factor to calculate uptake rated based on uptake of a different nutrient
          form: affinity                    # options: affinity or constituent
          # affinity: uses specific affinity, based on cell quota w.r.t base element
          # constituent: uses concentration of phytoplankton constituent of nutrient element
          luxury_storage: 1.
          max_photo_rate: 1.6               # [1/d]
          specific_affinity: 0.0025         # [m^3 / (mg C . d)]
        # po4:
        #   basis: nutrient
        #   strategy: coupled
        #   coupled_uptake:
        #     link: no3
        #     convert_uptake: 1/2
        #     method: min
        #   form: affinity                    # options: affinity or constituent
        #   # affinity: uses specific affinity, based on cell quota w.r.t base element
        #   # constituent: uses concentration of phytoplankton constituent of nutrient element
        #   luxury_storage: 1.
        #   max_photo_rate: 1.6               # [1/d]
        #   specific_affinity: 0.0025         # [m^3 / (mg C . d)]
        

  zoo1:
    long_name: mesozooplankton
    type: zooplankton
    composition: [c,n,p]
    parameters:
      cell_quota:
        # n: {opt: 1.258E-02}
        # p: {opt: 7.862E-04}
        opt: {n: 1.258E-02, p: 7.862E-04}
      
      temperature_regulation:
        temp_limited: True
        function: q10                       # options: arrhenius, eppley, or q10
        # arrhenius: needs "activation_energy" and "coefficient" as additional parameters
        # eppley: needs "coefficient" as additional parameter
        # q10: needs "base_temp" and "coefficient" as additional parameters
        coefficient: 2.0
        base_temp: 20.

      oxygen_inhibition:
        oxygen_limited: True
        half_sat: 50.                       # [mmol O2 / m^3]
        exponent: 1.                        # optional: Hill exponent for Monod function (default to 1. if not included)
      
      om_partition:
        dom1: {c: 0.60, n: 0.72, p: 0.832}  # c,n,p [-]
        pom1: {c: 0.40, n: 0.28, p: 0.168}  # c,n,p [-]

      efficiency:
        assimilation: 0.5
        ingestion: 0.25

      egestion:
        dom1: grazing
        pom1: grazing

      excretion:
        nh4: grazing
        po4: grazing

      # excretion:
      #   # assimilation_efficiency: 0.25
      #   # ingestion_efficiency: 0.5
      #   # efficiency:
      #   #   assimilation: 0.25
      #   #   ingestion: 0.5
      #   function:                           # options: constant or grazing
      #   # constant: based on constant excretion rate
      #   # grazing: based on ingestion efficiency of total grazing
      #     nh4: grazing
      #     po4: grazing
      #     dom1: grazing
      #     pom1: grazing
      #   # partition:
      #   #   dom1: {c: 0.60, n: 0.72, p: 0.832}  # c,n,p [-]
      #   #   pom1: {c: 0.40, n: 0.28,p: 0.168}   # c,n,p [-]

      grazing:
        grazing_preferences: {phyto1: 1., zoo1: 1.E-06}
        function: holling-2
        feeding_threshold: 50.0             # [mg C / m^3]
        max_grazing_rate: 2.0               # [1/d]
        half_sat_grazing: 200.0             # [mg C / m^3]

      mortality:
        oxygen_limited: True
        half_sat_oxygen: 0.5                # [mmol O2 / m^3]
        mortality_rate: 
          linear: 1.E-06                    # linear [1/d]
          quadratic: 0.0                    # quadratic [1/d^2]
        mortality_rate_oxy: 0.25            # [1/d]
        # partition:
        #   dom1: {c: 0.60, n: 0.72, p: 0.832}  # c,n,p [-]
        #   pom1: {c: 0.40, n: 0.28,p: 0.168}   # c,n,p [-]

      respiration:
        respiration_rate: 0.02              # [1/d]
        convert_o2: 1/12                    # [mmol 02 / mg C]

  dom1:
    long_name: dissolved organic matter
    type: detritus
    form: dissolved
    composition: [c,n,p]
    parameters:
      light_attenuation: 0.0                # [m^2 / mg C]

      remineralization:
        remineralization_rate: 0.05         # [1/d]
        convert_o2: 1/12                    # [mmol 02 / mg C]

      sedimentation:
        sinking: False
        background_sinking_rate: 0.                    # [m/d]
        burial_velocity: 0.                 # [m/d]

  pom1:
    long_name: particulate organic matter
    type: detritus
    form: particulate
    composition: [c,n,p]
    parameters:
      light_attenuation: 1.0E-04            # [m^2 / mg C]

      remineralization:
        remineralization_rate: 0.1          # [1/d]
        convert_o2: 1/12                    # [mmol 02 / mg C]
        
      sedimentation:
        sinking: True
        background_sinking_rate: 1.                    # [m/d]
        burial_velocity: 1.                 # [m/d]

# -------------------------------------------------------------------------------------------------
reactions:
  - type: chlorophyll_synthesis
    consumed:
    produced:
      phyto1: [chl]

  - type: excretion
    consumed:
      zoo1: [n]
    produced:
      nh4: [n]

  - type: excretion
    consumed:
      zoo1: [p]
    produced:
      po4: [p]

  # - type: excretion
  #   consumed: 
  #     zoo1: [c,n,p]
  #   produced:
  #     dom1: [c,n,p]

  # - type: excretion
  #   consumed: 
  #     zoo1: [c,n,p]
  #   produced:
  #     pom1: [c,n,p]

  - type: egestion
    consumed: 
      zoo1: [c,n,p]
    produced:
      dom1: [c,n,p]

  - type: egestion
    consumed: 
      zoo1: [c,n,p]
    produced:
      pom1: [c,n,p]

  - type: exudation
    consumed:
      phyto1: [c]
    produced:
      dom1: [c]

  - type: grazing
    consumed:
      phyto1: [c,n,p,chl]
    produced:
      zoo1: [c,n,p]

  - type: gross_primary_production
    consumed:
    produced:
      phyto1: [c]
      o2: [o]

  - type: lysis
    consumed:
      phyto1: [c,n,p]
    produced:
      dom1: [c,n,p]

  - type: lysis
    consumed:
      phyto1: [c,n,p]
    produced:
      pom1: [c,n,p]

  - type: mortality
    consumed:
      zoo1: [c,n,p]
    produced:
      dom1: [c,n,p]

  - type: mortality
    consumed:
      zoo1: [c,n,p]
    produced:
      pom1: [c,n,p]

  - type: nitrification
    consumed:
      nh4: [n]
      o2: [o]
    produced: 
      no3: [n]

  - type: photosynthesis
    consumed:
      phyto1: [c]
    produced:

  - type: reaeration
    consumed:
    produced:
      o2: [o]

  - type: remineralization
    consumed:
      dom1: [c]
      o2: [o]
    produced:

  - type: remineralization
    consumed:
      dom1: [n]
    produced:
      nh4: [n]

  - type: remineralization
    consumed:
      dom1: [p]
    produced:
      po4: [p]
    
  - type: remineralization
    consumed:
      pom1: [c]
      o2: [o]
    produced:
    
  - type: remineralization
    consumed:
      pom1: [n]
    produced:
      nh4: [n]
      
  - type: remineralization
    consumed:
      pom1: [p]
    produced:
      po4: [p]
      
  - type: respiration
    consumed:
      phyto1: [c]
      o2: [o]
    produced:

  - type: respiration
    consumed:
      zoo1: [c]
      o2: [o]
    produced:

  # - type: uptake
  #   consumed:
  #     no3: [n]
  #     nh4: [n]
  #   produced:
  #     phyto1: [n]
  #     dom1: [n]

  - type: uptake
    consumed:
      no3: [n]
    produced:
      phyto1: [n]
      dom1: [n]

  - type: uptake
    consumed:
      nh4: [n]
    produced:
      phyto1: [n]
      dom1: [n]

  - type: uptake
    consumed:
      po4: [p]
    produced:
      phyto1: [p]
      dom1: [p]
  