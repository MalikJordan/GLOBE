    parameters:
      light_attenuation: 0.03               # [m^2 / mg Chl]
      max_photo_rate: 1.6                   # [1/d]
      cell_quota:
        constituents: ["c","n","p","chl"]
        max: [1., 0.025, 2.5E-03, 0.016]
        min: [1., 6.873E-03, 4.29E-04, 0.016]
        opt: [1., 1.26E-02, 7.86E-04, 0.016]
      nutrient_limitation:  
        colimitation: minimum               # mininimum, product, or sum of all limiting nutrients
        include: ["no3","po4"]              # nutrients included for calculation of colimitation factor
        no3:
          type: internal
          function: droop
          nh4_inihibited: True
        nh4:
          type: external
          function: monod
          half_sat: 1.
        po4:
          type: internal
          function: droop
      temperature_regulation:
        temp_limited: True
        function: q10
        coefficient: 2.
        base_temp: 10.

  zoo1:
    long_name: mesozooplankton
    type: zooplankton
    composition:                            # element : initial concentration
      c: from_file
      n: cell_quota
      p: cell_quota
    parameters:
      assimilation_efficiency: 0.5
      ingestion_efficiency: 0.25
      cell_quota:
        constituents: ["c","n","p"]
        opt: [1., 1.67E-02, 1.85E-03]
      grazing_preferences: 
        phyto1: 1.0
      temperature_regulation:
        temp_limited: True
        function: q10
        coefficient: 2.0
        base_temp: 10.
      oxygen_inhibition:
        oxygen_limited: True
        function: monod
        half_sat: 50.                       # [mmol O2 / m^3]

  dom1:
    long_name: dissolved organic matter
    type: detritus
    composition:
      c: from_file
      n: cell_quota
      p: cell_quota
    parameters:
      light_attenuation: 0.0                # [m^2 / mg C]

  pom1:
    long_name: particulate organic matter
    type: detritus
    composition:                            # element : initial concentration
      c: from_file
      n: cell_quota
      p: cell_quota
    parameters:
      light_attenuation: 1.0E-04            # [m^2 / mg C]

# -------------------------------------------------------------------------------------------------
reactions:
  - type: chlorophyll_synthesis
    consumed:
    produced:
      phyto1: [chl]
    parameters:
      eps_PAR: 0.4                        # [-]
      initial_PI_slope: 1.52E-05
      chl_quota: 0.016                    # [mg Chl / mg C]
      chl_relax_rate: 0.            # [(mg C . m^2) / (mg Chl μE)]
      optimal_Epar_Ek: 0.0
      max_photo_rate: 1.6                 # [1/d]
      light_attenuation_water: 0.0435     # [1/m]
      light_attenuation_phyto: 0.03       # [m^2 / mg Chl]

  # - type: egestion
  #   consumed:
  #     zoo1: [c,n,p]
  #   produced:
  #     dom1: [c,n,p]
  #   parameters:
  #     partition: [0.60,0.72,0.832]        # c,n,p [-]

  # - type: egestion
  #   consumed:
  #     zoo1: [c,n,p]
  #   produced:
  #     pom1: [c,n,p]
  #   parameters:
  #     half_sat_oxygen: 0.5                # [mmol O2 / m^3]
  #     partition: [0.40,0.28,0.168]        # c,n,p [-]

  - type: excretion
    consumed:
      zoo1: [n]
    produced:
      nh4: [n]
    parameters:
      function: grazing
      optimal_nutrient_quota: 0.0167      # [mmol N / mg C]

  - type: excretion
    consumed:
      zoo1: [p]
    produced:
      po4: [p]
    parameters:
      function: grazing
      optimal_nutrient_quota: 1.85E-03    # [mmol P / mg C]

  - type: excretion
    consumed: 
      zoo1: [c,n,p]
    produced:
      dom1: [c,n,p]
    parameters:
      function: grazing
      assimilation_efficiency: 0.25
      ingestion_efficiency: 0.5
      partition: [0.60,0.72,0.832]        # c,n,p [-]

  - type: excretion
    consumed: 
      zoo1: [c,n,p]
    produced:
      pom1: [c,n,p]
    parameters:
      function: grazing
      assimilation_efficiency: 0.25
      ingestion_efficiency: 0.5
      partition: [0.40,0.28,0.168]        # c,n,p [-]

  - type: exudation
    consumed:
      phyto1: [c]
    produced:
      dom1: [c]
    parameters:
      method: photosynthesis              # options: uptake, photosynthesis
      # "photosynthesis": exudation rate calculated using excreted fraction of photosynthesis
      # "uptake": exudation rate calculated using constant excreted fraction of nutrient uptake
      excreted_fraction: 0.05             # [-]

  - type: grazing
    consumed:
      phyto1: [c,n,p,chl]
    produced:
      zoo1: [c,n,p]
    parameters:
      function: holling-2
      ingestion_type: feeding_threshold
      feeding_threshold: 50.0             # [mg C / m^3]
      max_grazing_rate: 2.0               # [1/d]
      half_sat_grazing: 200.0             # [mg C / m^3]

  - type: gross_primary_production
    consumed:
    produced:
      phyto1: [c]
      o2: [o]
    parameters:
      convert_o2: 1/12

  - type: lysis
    consumed:
      phyto1: [c,n,p]
    produced:
      dom1: [c,n,p]
    parameters:
      method: cell_quota
      extra_lysis_rate: 0.0               # [1/d]
      half_sat_stress_lysis: 0.1
      half_sat_extra_lysis: 0.0
      max_stress_lysis_rate: 0.05         # [1/d]
      om_type: dissolved

  - type: lysis
    consumed:
      phyto1: [c,n,p]
    produced:
      pom1: [c,n,p]
    parameters:
      method: cell_quota
      extra_lysis_rate: 0.0               # [1/d]
      half_sat_stress_lysis: 0.1
      half_sat_extra_lysis: 0.0
      max_stress_lysis_rate: 0.05         # [1/d]
      om_type: particulate

  - type: mortality
    consumed:
      zoo1: [c,n,p]
    produced:
      dom1: [c,n,p]
    parameters:
      oxygen_limited: True
      half_sat_oxygen: 0.5                # [mmol O2 / m^3]
      mortality_rate: [0.0,0.0]          # linear [1/d], quadratic [1/d^2]
      mortality_rate_oxy: 0.25            # [1/d]
      partition: [0.60,0.72,0.832]        # c,n,p   [-]

  - type: mortality
    consumed:
      zoo1: [c,n,p]
    produced:
      pom1: [c,n,p]
    parameters:
      oxygen_limited: True
      half_sat_oxygen: 0.5                # [mmol O2 / m^3]
      mortality_rate: [0.0,0.0]          # linear [1/d], quadratic [1/d^2]
      mortality_rate_oxy: 0.25            # [1/d]
      partition: [0.40,0.28,0.168]        # c,n,p   [-]

  - type: nitrification
    consumed:
      nh4: [n]
      o2: [o]
    produced: 
      no3: [n]
    parameters:
      half_sat_oxygen: 10.0               # [mmol O2 / m^3]
      nitrification_rate: 0.01            # [1/d]
      convert_o2: 2.0

  - type: photosynthesis
    consumed:
      phyto1: [c]
    produced:
    parameters:
      eps_PAR: 0.4
      light_limitation: platt
      light_location: integrated
      light_attenuation_water: 0.0435
      light_attenuation_phyto: 0.03
      initial_PI_slope: 1.52E-05     # [(mg C . m^2) / (mg Chl μE)]
      max_photo_rate: 1.6                 # [1/d]

  - type: reaeration
    consumed:
    produced:
      o2: [o]
    parameters:
      d: 0.31
      k1: 1953.4
      k2: 128.0
      k3: 3.9918
      k4: 0.050091
      schmidt: 660.0

  - type: remineralization
    consumed:
      dom1: [c]
      o2: [o]
    produced:
    parameters:
      remineralization_rate: 0.3          # [1/d]
      convert_o2: 1/12

  - type: remineralization
    consumed:
      dom1: [n]
    produced:
      nh4: [n]
    parameters:
      remineralization_rate: 0.3          # [1/d]

  - type: remineralization
    consumed:
      dom1: [p]
    produced:
      po4: [p]
    parameters:
      remineralization_rate: 0.25         # [1/d]

  - type: remineralization
    consumed:
      pom1: [c]
      o2: [o]
    produced:
    parameters:
      remineralization_rate: 0.3          # [1/d]
      convert_o2: 1/12

  - type: remineralization
    consumed:
      pom1: [n]
    produced:
      nh4: [n]
    parameters:
      remineralization_rate: 0.3          # [1/d]

  - type: remineralization
    consumed:
      pom1: [p]
    produced:
      po4: [p]
    parameters:
      remineralization_rate: 0.3          # [1/d]

  - type: reoxidation
    consumed:
      hs: [s]
      o2: [o]
    produced:
    parameters:
      half_sat_oxygen: 10.0               # [mmol O2 / m^3]
      reoxidation_rate: 0.05              # [1/d]
      convert_o2: 2.         # [mmol O2 / mmol HS-]

  - type: respiration
    consumed:
      phyto1: [c]
      o2: [o]
    produced:
    parameters:
      activity_respiration_frac: 0.05     # [-]
      basal_respiration_rate: 0.05        # [1/d]
      convert_o2: 1/12                    # [mmol O2 / unit base_element]

  - type: respiration
    consumed:
      zoo1: [c]
      o2: [o]
    produced:
    parameters:
      respiration_rate: 0.02              # [1/d]
      convert_o2: 1/12

  - type: uptake
    consumed:
      no3: [n]
      nh4: [n]
    produced:
      phyto1: [n]
      dom1: [n]
    parameters:
      basis: nutrient
      strategy: independent
      form: affinity                      # options: affinity or constituent
      # affinity: uses specific affinity, based on cell quota w.r.t base element
      # constituent: uses concentration of phytoplankton constituent of nutrient element
      half_sat_nh4_preference: 1.0
      half_sat_nh4_uptake: 1.5            # [mmol N-NH4 / m^3]
      luxury_storage: 1.5
      max_photo_rate: 1.6                 # [1/d]
      specific_affinity: 0.025            # [m^3 / (mg C . d)]

  - type: uptake
    consumed:
      po4: [p]
    produced:
      phyto1: [p]
      dom1: [p]
    parameters:
      basis: nutrient
      strategy: independent
      form: affinity                      # options: affinity or constituent
      # affinity: uses specific affinity, based on cell quota w.r.t base element
      # constituent: uses concentration of phytoplankton constituent of nutrient element
      luxury_storage: 1.0
      max_photo_rate: 1.6                 # [1/d]
      specific_affinity: 0.0025           # [m^3 / (mg C . d)]


  
  