base_element: n                       # mmol N / m^3

tracers:
  no3:
    long_name: nitrate
    type: inorganic
    composition: [n]
    parameters:
      temperature_regulation:
        temp_limited: False

  phyto:
    long_name: diatoms
    type: phytoplankton
    composition: [n]
    parameters:
      cell_quota:
        max: {n: 1.}
        min: {n: 1.}
        opt: {n: 1.}
      
      nutrient_limitation: 
        no3:
          type: external
          function: monod
          half_sat: 1.

      temperature_regulation:
        temp_limited: False

      exudation:
        method: constant
        excreted_fraction: 0.1

      growth:
        light_attenuation: 0.
        light_limitation: 0.25
        max_photo_rate: eppley
        type: base_b
        a: 0.6
        b: 1.066
        c: 1.
        silicate_limitation: False

      respiration:
        activity_respiration_frac: 0.
        basal_respiration_rate: 0.15

      uptake:
        no3:
          strategy: independent
          basis: growth
          half_sat_uptake: 1.
          numerator: self
          denominator: self
          exclude_respiratory_cost: False

  zoo:
    long_name: mesozooplankton
    type: zooplankton
    composition: [n]
    parameters:
      cell_quota:
        opt: {n: 1.}
      
      efficiency:
        assimilation: 1.
        ingestion: 1.

      temperature_regulation:
        temp_limited: False

      oxygen_inhibition:
        oxygen_limited: False

      # egestion:
      #   unassimilated: []

      # excretion:
      #   destination:
      #     n: no3
      #   function:
      #     n: activity

      grazing:
        grazing_preferences: {phyto: 1.}
        function: ivlev
        max_grazing_rate: 1.
        ivlev: 0.2

      mortality:
        mortality_rate:
          linear: 0.2
          quadratic: 0.
          oxygen: 0.
        temp_limitation:
          linear:
          quadratic: False
          oxygen: False


  pom:
    long_name: particulate organic matter
    type: detritus
    form: particulate
    composition: [n]
    parameters:
      light_attenuation: 0.

      remineralization:
        remineralization_rate: 0.4


reactions:
  # Phyto
  - type: exudation
    consumed:
      phyto: [n]
    produced:
      no3: [n]

  - type: photosynthesis
    consumed:
      phyto: [n]
    produced:

  - type: respiration
    consumed:
      phyto: [n]
    produced:
      pom: [n]
      
  - type: uptake
    consumed:
      no3: [n]
    produced:
      phyto: [n]

  # Zoo
  - type: grazing
    consumed:
      phyto: [n]
    produced:
      zoo: [n]

  - type: mortality
    consumed:
      zoo: [n]
    produced:
      no3: [n]

  # POM
  - type: remineralization
    consumed:
      pom: [n]
    produced:
      no3: [n]
  