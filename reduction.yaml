title: average dic concentration

error_limit: 50.0

target: # target tracer constituents for reduction scheme
  co2: [c]

safe:   # tracers to be retained in reduction, regardless of interaction coefficient
  no3: [n]
  nh4: [n]
  po4: [p]
  dom2: [c]

mode: average     # average, peak, or time_of_peak
# "average": average concentration over specified time period
# "peak": peak concentration during specified time period
# "time_of_peak": time of peak concentration during specified time period

time_period: # time period (in days) used in mode
  start: 360
  end: 720

# reassign: # ranking of groups from highest to lowest importance
# # initial concentrations of removed tracers will be reassigned to the remaining tracer of similar type with the highest importance
# # ex: if mesozoo2 is removed and microzoo1 is retained, the inital concentration of mesozoo2 will be added to that of microzoo1
# # ex: if phyto2, phyto3, and phyto1 are removed, their initial concentrations will be added to that of phyto4
#   phytoplankton: [phyto2, phyto3, phyto4, phyto1]
#   zooplankton: [microzoo1, microzoo2, mesozoo2, mesozoo1]
#   dissolved: [dom1, dom2, dom3]

