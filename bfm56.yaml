base_element: c

tracers:
  o2:
    long_name: oxygen
    type: inorganic
    composition: [o]
    parameters:
      temperature_regulation:
        temp_limited: False
      surface_flux: True

      reaeration:
        d: 0.31
        k1: 1953.4
        k2: 128.0
        k3: 3.9918
        k4: 0.050091
        schmidt: 660.0
        saturation_conversion: ideal_gas    # options: "ideal_gas" or "stp"

  po4:
    long_name: phosphate
    type: inorganic
    composition: [p]
    parameters:
      temperature_regulation:
        temp_limited: False

  no3:
    long_name: nitrate
    type: inorganic
    composition: [n]
    parameters:
      temperature_regulation:
        temp_limited: True
        function: q10                       # options: arrhenius, eppley, or q10
        # arrhenius: needs "activation_energy" and "coefficient" as additional parameters
        # eppley: needs "coefficient" as additional parameter
        # q10: needs "base_temp" and "coefficient" as additional parameters
        coefficient: 2.
        base_temp: 20.

      denitrification:
        anoxic_mineralization_rate: 1.
        denitrification_rate: 0.35
        # nit_anoxic_coeff: 1.25
        # oxic_anoxic_coeff: 0.5
        
  nh4:
    long_name: ammonium
    type: inorganic
    composition: [n]
    parameters:
      temperature_regulation:
        temp_limited: True
        function: q10                       # options: [1] arrhenius, [2] eppley, or [3] q10
        # arrhenius: needs "activation_energy" and "coefficient" as additional parameters
        # eppley: needs "coefficient" as additional parameter
        # q10: needs "base_temp" and "coefficient" as additional parameters
        coefficient: 2.
        base_temp: 20.

      nitrification:
        half_sat_oxygen: 10.0               # [mmol O2 / m^3]
        nitrification_rate: 0.01            # [1/d]
        convert_o2: 2.0

  n2:
    long_name: nitrogen sink
    type: inorganic
    composition: [n]
    parameters:
      temperature_regulation:
        temp_limited: False

  sio4:
    long_name: silicate
    type: inorganic
    composition: [si]
    parameters:
      temperature_regulation:
        temp_limited: True
        function: q10
        coefficient: 1.49
        base_temp: 20.

  hs:
    long_name: reduction equivalents
    type: inorganic
    composition: [s]
    parameters:
      temperature_regulation:
        temp_limited: False

      reoxidation:
        half_sat_oxygen: 10.0               # [mmol O2 / m^3]
        reoxidation_rate: 0.05              # [1/d]
        convert_o2: 2.                      # stoichiometric conversion [mmol O2 / mmol HS-]

  bac1:
    long_name: bacterioplankton
    type: bacteria
    composition: [c,n,p]
    parameters:
      cell_quota:
        # min: {n: 1.67E-02, p: 1.85E-03}
        # opt: {n: 1.67E-02, p: 1.85E-03}
        min: {c: 1., n: 1.67E-02, p: 1.85E-03}
        opt: {c: 1., n: 1.67E-02, p: 1.85E-03}

      oxygen_inhibition:
        oxygen_limited: True
        half_sat: 30.                       # [mmol O2 / m^3]
        exponent: 3.                        # optional: Hill exponent for Monod function (default to 1. if not included)
      
      temperature_regulation:
        temp_limited: True
        function: q10
        coefficient: 2.95
        base_temp: 20.

      om_partition:
        dom1: {c: 0.60, n: 0.72, p: 0.832}  # c,n,p [-]
        pom1: {c: 0.40, n: 0.28, p: 0.168}  # c,n,p [-]

      excretion:                            # options: "activity", "relaxation", or constant
        # if "activity": uses uptake rate to calculate nutrient excretion
        #                requires "activity_respiration_frac" and "excretion_rate" as additional parameters
        # if "relaxation": uses relaxation time scale to calculate excess nutrient excretion above cell quota
        #                  requires "relaxation_timescale" as an additional parameter
        #                  requires "half_sat" if exretion to inorganic nutrient
        # if "constant": uses constant excretion rate
        #                requires "excretion_rate" as an additional parameter
        # nh4: 
        #   option: relaxation
        #   relaxation_time: 1.
        #   half_sat: 5.
        # po4: 
        #   option: relaxation
        #   relaxation_time: 1.
        #   half_sat: 0.5
        dom2:
          option: relaxation
          relaxation_timescale: 1.
        dom3:
          option: activity
          activity_respiration_frac: 0.6
          excretion_rate: 0.

      mortality:
        mortality_rate:
          linear: 0.1
          quadratic: 0.
        temp_limitation:
          linear: True
          quadratic: False

      respiration:
        activity_respiration_frac: 0.6
        anoxic_respiration_frac: 0.2
        basal_respiration_rate: 0.01
        convert_o2: 1/12
        convert_hs: 1/24

      uptake:
        potential_rich: {dom1: 0.3, dom2: 0., dom3: 0., pom1: 0.01}
        potential_poor: {dom1: 0., dom2: 0., dom3: 0., pom1: 0.}
        max_growth_rate: 8.38
        substrate_correction: False
        option: potential                  # options: direct or potential
        # direct: directly calculates uptake of nutrient
        #         requires dictionary for each nutrient which includes "strategy"
        #         if "strategy" == "coupled" --> requires "coupled_uptake" dictionary which includes "method" and "link", may include "convert_uptake"
        #         if "strategy" == "independent" --> requires "max_growth_rate", "basal_metabolic_rate", "max_growth_efficiency", and "half_sat", may include "convert_uptake"
        # potential: determines potential & realized uptake then calculates nutrient uptake based on those values
        #            requires "max_growth_rate", "potential_rich", "potential_poor", and "substrate_correction"

      uptake_release:
        nh4:
          half_sat: 5.
          relaxation_timescale: 1.
        po4:
          half_sat: 1.
          relaxation_timescale: 1.

  phyto1:
    long_name: diatoms
    type: phytoplankton
    composition: [c,n,p,chl,si]
    parameters:
      cell_quota:
        # max: {n: 1.26E-02, p: 7.86E-04, chl: 0.035, si: 8.5E-03}
        # min: {n: 6.87E-03, p: 4.29E-04, chl: 0.035, si: 4.3E-03}
        # opt: {n: 1.26E-02, p: 7.86E-04, chl: 0.035, si: 8.5E-03}
        max: {c: 1., n: 1.26E-02, p: 7.86E-04, chl: 0.035, si: 8.5E-03}
        min: {c: 1., n: 6.87E-03, p: 4.29E-04, chl: 0.035, si: 4.3E-03}
        opt: {c: 1., n: 1.26E-02, p: 7.86E-04, chl: 0.035, si: 8.5E-03}

      nutrient_limitation:  
        colimitation: minimum               # [1] mininimum, [2] product, or [3] sum of all limiting nutrients
        include: ["no3","po4"]              # nutrients included for calculation of colimitation factor
        no3:
          type: internal
          function: droop
          nh4_inhibited: True
        nh4:
          type: external
          function: monod
          half_sat: 1.
        po4:
          type: internal
          function: droop
        sio4:
          type: external
          function: monod
          half_sat: 1.

      sedimentation:
        sinking: True
        background_sinking_rate: 0.
        max_sinking_rate: 5.
        burial_velocity: 0.
        sinking_threshold: 0.7

      temperature_regulation:
        temp_limited: True
        function: q10                       # options: [1] arrhenius, [2] eppley, or [3] q10
        # arrhenius: needs "activation_energy" and "coefficient" as additional parameters
        # eppley: needs "coefficient" as additional parameter
        # q10: needs "base_temp" and "coefficient" as additional parameters
        coefficient: 2.
        base_temp: 20.

      exudation:
        method: photosynthesis              # options: uptake, photosynthesis
        # "photosynthesis": exudation rate calculated using excreted fraction of photosynthesis
        # "uptake": exudation rate calculated using constant excreted fraction of nutrient uptake
        excreted_fraction: 0.01             # [-]
        include_activity: True
        include_nutrient_stress: True

      growth:
        light_limitation: platt             # options: monod, geider, platt, or smith
        light_location: integrated          # options: top, middle, or integrated
        # top: light calculated at top of the cell
        # middle: light calculated in middle of cell
        # integrated: light integrated through cell
        light_attenuation: 0.03
        max_photo_rate: 2.5
        chl_quota: 0.035                    # [mg Chl / mg C]
        chl_relax_rate: 0.25                # [(mg C . m^2) / (mg Chl μE)]
        initial_PI_slope: 1.1E-05
        eps_PAR: 0.4
        convert_o2: 1/12                    # [mmol 02 / mg C]
        optimal_Epar_Ek: 3.
        silicate_limitation: True

      lysis:
        method: cell_quota                  # options: constant or cell_quota
        # constant: based on constant lysis rate
        # cell_quota: based on elemental ratios within zooplankton cell, requires "apportioning factor" as additional parameter
        extra_lysis_rate: 0.
        half_sat_stress_lysis: 0.1
        half_sat_extra_lysis: 0.0
        max_stress_lysis_rate: 0.01         # [1/d]
        apportioning_factor:  # list of elements of which to apply apportioning factor to, elements not included will not have dissolved/particulate apportioning factor applied
          dom1: [c,n,p]
          pom1: [c,n,p]

      respiration:
        activity_respiration_frac: 0.1      # [-]
        basal_respiration_rate: 0.05        # [1/d]
        convert_o2: 1/12                    # [mmol 02 / mg C]

      uptake:
        no3:
          basis: nutrient                   # (if strategy is "independent") options: constant, growth, or nutrient
          # constant: based on constant uptake rate
          # growth: based on photosynthesis and nutrient limitation
          # nutrient: based on nutrient availabilty
          strategy: independent             # options: independent or coupled
          # independent: calculates uptake rate based on the nutrient
          # coupled: uses conversion factor to calculate uptake rated based on uptake of a different nutrient
          form: affinity                    # options: affinity or constituent
          # affinity: uses specific affinity, based on cell quota w.r.t base element
          # constituent: uses concentration of phytoplankton constituent of nutrient element
          half_sat_nh4_preference: 1.
          luxury_storage: 2.
          # max_photo_rate: 2.5               # [1/d]
          specific_affinity: 0.025          # [m^3 / (mg C . d)]
        nh4:
          basis: nutrient                   # (if strategy is "independent") options: constant, growth, or nutrient
          # constant: based on constant uptake rate
          # growth: based on photosynthesis and nutrient limitation
          # nutrient: based on nutrient availabilty
          strategy: independent             # options: independent or coupled
          # independent: calculates uptake rate based on the nutrient
          # coupled: uses conversion factor to calculate uptake rated based on uptake of a different nutrient
          form: affinity                    # options: affinity or constituent
          # affinity: uses specific affinity, based on cell quota w.r.t base element
          # constituent: uses concentration of phytoplankton constituent of nutrient element
          half_sat_nh4_preference: 1.
          luxury_storage: 2.
          # max_photo_rate: 2.5               # [1/d]
          specific_affinity: 0.025          # [m^3 / (mg C . d)]
        po4:
          basis: nutrient                   # (if strategy is "independent") options: constant, growth, or nutrient
          # constant: based on constant uptake rate
          # growth: based on photosynthesis and nutrient limitation
          # nutrient: based on nutrient availabilty
          strategy: independent             # options: independent or coupled
          # independent: calculates uptake rate based on the nutrient
          # coupled: uses conversion factor to calculate uptake rated based on uptake of a different nutrient
          form: affinity                    # options: affinity or constituent
          # affinity: uses specific affinity, based on cell quota w.r.t base element
          # constituent: uses concentration of phytoplankton constituent of nutrient element
          luxury_storage: 2.
          # max_photo_rate: 2.5               # [1/d]
          specific_affinity: 0.0025         # [m^3 / (mg C . d)]
        # po4:
        #   basis: nutrient
        #   strategy: coupled
        #   coupled_uptake:
        #     link: no3
        #     convert_uptake: 1/2
        #     method: min
        #   form: affinity                    # options: affinity or constituent
        #   # affinity: uses specific affinity, based on cell quota w.r.t base element
        #   # constituent: uses concentration of phytoplankton constituent of nutrient element
        #   luxury_storage: 1.
        #   max_photo_rate: 1.6               # [1/d]
        #   specific_affinity: 0.0025         # [m^3 / (mg C . d)]
        sio4:
          basis: growth
          strategy: independent
          form: affinity
          # max_photo_rate: 2.5

