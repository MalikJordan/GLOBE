simulation:
  dt: 360.      # time step [s]
  days: 365           # days in simulation [d]
  configuration: 0d   # Options: 0d or 1d

water_column:
  column_depth: 10.    # depth [m]
  num_layers: 1      # number of layers in water column

environment:
  forcing: constant   # Options: constant, pom1d or seasonal
  # constant: forces system using constant values
  # pom1d: forces system using climatological data with one-dimensional POM1D ocean circulation
  # seasonal: forces system using sinusoidal forcing between summer and winter extremes
  base_temp: 10.0  
  PAR_frac: 1.
  light_attenuation_water: 0.05        # [1/m]
  latitude: 54.
  forcing_data:
    temperature: 10.
    salinity: 35.
    sunlight: 100.
    wind: 4.
    mld: 20.
  # forcing_data:
  #   summer_mld: 10.0
  #   winter_mld: 40.0
  #   summer_salt: 31.
  #   winter_salt: 33.5
  #   summer_sun: 240.0
  #   winter_sun: 20.0
  #   summer_temp: 15.
  #   winter_temp: 7.
  #   temp_excursion: 0.
  #   summer_wind: 2.
  #   winter_wind: 6.

initial_conditions:
  no3:
    composition:                            # element : initial concentration
      n: 8.3                                # [mmol N / m^3]

  nh4:
    composition:                            # element : initial concentration
      n: 0.22                               # [mmol N / m^3]

  bac:
    composition:                            # element : initial concentration
      n: 0.001                              # [mmol N / m^3]

  phyto:
    composition:                            # element : initial concentration
      n: 0.056666666                        # [mmol N / m^3]
  
  zoo:
    composition:                            # element : initial concentration
      n: 0.05                               # [mmol N / m^3]
  
  don:
    composition:                            # element : initial concentration
      n: 0.14                               # [mmol N / m^3]

  pon:
    composition:                            # element : initial concentration
      n: 0.416666666                        # [mmol N / m^3]
  